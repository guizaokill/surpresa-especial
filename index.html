<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Uma surpresa para uma princesa ❤️</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main class="container">

    <h1>Tenho algo para você...</h1>

    <div class="envelope" id="envelope">

        <div class="carta">

            <div class="texto-carta">

                <h2>Para Maria...</h2>

                <p id="mensagem"></p>

            </div>

        </div>

        <div class="aba"></div>

        <div class="selo">❤️</div>

    </div>

    <p id="instrucao">
        Clique no envelope para abrir
    </p>

    <button id="revelar">
        Revelar surpresa ❤️
    </button>

    <button id="controleMusica">
    ♫ Pausar música
</button>

    <div class="heart-container" id="heartContainer">

        <canvas id="heart"></canvas>

    </div>

    <p id="fraseFinal"></p>

</main>

<audio id="musica" loop preload="auto">
    <source src="./musica.mp3" type="audio/mpeg">
</audio>

    <!-- PARTÍCULAS DO FUNDO -->

    <div class="flores"></div>

    <script src="./script.js"></script>

</body>

</html>
